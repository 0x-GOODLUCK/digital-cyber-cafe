<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%" fill="none">
  <!-- Subtle Background Glow / Digital Grid Elements -->
  <circle cx="270" cy="210" r="180" fill="#F0F6FF" />
  <circle cx="440" cy="90" r="60" fill="#E8F1FD" opacity="0.6"/>
  <circle cx="90" cy="320" r="45" fill="#E8F1FD" opacity="0.6"/>

  <!-- Subtle grid dots -->
  <g fill="#93C5FD" opacity="0.35">
    <circle cx="50" cy="80" r="2.5"/><circle cx="70" cy="80" r="2.5"/><circle cx="90" cy="80" r="2.5"/>
    <circle cx="50" cy="100" r="2.5"/><circle cx="70" cy="100" r="2.5"/><circle cx="90" cy="100" r="2.5"/>
    <circle cx="50" cy="120" r="2.5"/><circle cx="70" cy="120" r="2.5"/><circle cx="90" cy="120" r="2.5"/>
    <circle cx="460" cy="280" r="2.5"/><circle cx="480" cy="280" r="2.5"/><circle cx="500" cy="280" r="2.5"/>
    <circle cx="460" cy="300" r="2.5"/><circle cx="480" cy="300" r="2.5"/><circle cx="500" cy="300" r="2.5"/>
  </g>

  <!-- Desk Surface Shadow & Line -->
  <ellipse cx="270" cy="365" rx="210" ry="16" fill="#E2E8F0" opacity="0.8"/>
  <path d="M70 365h400" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

  <!-- Computer Workstation Setup -->
  <!-- Monitor Base & Stand -->
  <path d="M250 325h40v40h-40z" fill="#94A3B8"/>
  <path d="M225 362h90c2 0 4 1.5 4 3.5s-2 3.5-4 3.5h-90c-2 0-4-1.5-4-3.5s2-3.5 4-3.5z" fill="#64748B"/>

  <!-- Monitor Frame -->
  <rect x="150" y="110" width="240" height="180" rx="14" fill="#173B67" filter="drop-shadow(0 15px 25px rgba(23,59,103,0.18))"/>
  <rect x="160" y="120" width="220" height="154" rx="8" fill="#FFFFFF"/>

  <!-- Monitor Screen Header Bar -->
  <rect x="160" y="120" width="220" height="26" rx="8" fill="#F8FAFC"/>
  <circle cx="174" cy="133" r="3.5" fill="#EF4444"/>
  <circle cx="186" cy="133" r="3.5" fill="#F59E0B"/>
  <circle cx="198" cy="133" r="3.5" fill="#10B981"/>
  <rect x="220" y="127" width="130" height="12" rx="6" fill="#E2E8F0"/>

  <!-- Screen Content: Digital Portal / Application Dashboard -->
  <rect x="175" y="160" width="90" height="45" rx="6" fill="#F1F5F9"/>
  <rect x="183" y="169" width="40" height="6" rx="3" fill="#3478D4"/>
  <rect x="183" y="181" width="72" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="183" y="189" width="55" height="4" rx="2" fill="#E2E8F0"/>

  <rect x="275" y="160" width="90" height="45" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <rect x="283" y="169" width="45" height="6" rx="3" fill="#10B981"/>
  <rect x="283" y="181" width="70" height="4" rx="2" fill="#93C5FD"/>
  <rect x="283" y="189" width="50" height="4" rx="2" fill="#BFDBFE"/>

  <rect x="175" y="215" width="190" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="195" cy="239" r="12" fill="#E0F2FE"/>
  <path d="M191 239l3 3 6-6" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="215" y="231" width="80" height="6" rx="3" fill="#172B45"/>
  <rect x="215" y="242" width="130" height="4" rx="2" fill="#94A3B8"/>

  <!-- Floating Digital Document (Left) -->
  <g transform="translate(60, 160)" filter="drop-shadow(0 12px 24px rgba(23,43,69,0.12))">
    <rect x="0" y="0" width="95" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="14" y="16" width="38" height="6" rx="3" fill="#3478D4"/>
    <line x1="14" y1="32" x2="80" y2="32" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="44" x2="70" y2="44" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="56" x2="76" y2="56" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="68" x2="60" y2="68" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <rect x="14" y="82" width="67" height="32" rx="4" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <path d="M40 98l4 4 8-8" stroke="#16A34A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Digital Identity / Card (Right) -->
  <g transform="translate(370, 75)" filter="drop-shadow(0 14px 26px rgba(23,43,69,0.14))">
    <rect x="0" y="0" width="125" height="85" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <!-- Card header stripe -->
    <rect x="0" y="0" width="125" height="20" rx="8" fill="#173B67"/>
    <rect x="10" y="7" width="45" height="6" rx="3" fill="#FFFFFF"/>
    <!-- Photo placeholder -->
    <rect x="12" y="28" width="34" height="42" rx="4" fill="#E2E8F0"/>
    <circle cx="29" cy="42" r="7" fill="#94A3B8"/>
    <path d="M19 64c0-5 4-8 10-8s10 3 10 8" fill="#94A3B8"/>
    <!-- Card details lines -->
    <rect x="54" y="32" width="60" height="5" rx="2.5" fill="#172B45"/>
    <rect x="54" y="42" width="48" height="4" rx="2" fill="#64748B"/>
    <rect x="54" y="52" width="55" height="4" rx="2" fill="#94A3B8"/>
    <rect x="54" y="62" width="35" height="4" rx="2" fill="#3478D4"/>
  </g>

  <!-- Modern Printer Device Element (Right desk) -->
  <g transform="translate(390, 260)" filter="drop-shadow(0 10px 18px rgba(0,0,0,0.08))">
    <rect x="0" y="35" width="85" height="45" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Paper feeding tray -->
    <rect x="15" y="10" width="55" height="30" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="22" y1="20" x2="62" y2="20" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="26" x2="52" y2="26" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <!-- Output slot -->
    <rect x="12" y="55" width="60" height="6" rx="3" fill="#1E293B"/>
    <!-- Output paper sheet coming out -->
    <rect x="18" y="58" width="48" height="32" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="24" y1="68" x2="58" y2="68" stroke="#3478D4" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="24" y1="74" x2="50" y2="74" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="24" y1="80" x2="54" y2="80" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Status lights -->
    <circle cx="72" cy="45" r="2.5" fill="#10B981"/>
  </g>

  <!-- Keyboard and Mouse on Desk -->
  <rect x="185" y="345" width="130" height="12" rx="4" fill="#CBD5E1"/>
  <rect x="330" y="347" width="16" height="22" rx="7" fill="#CBD5E1"/>
  <line x1="338" y1="347" x2="338" y2="355" stroke="#94A3B8" stroke-width="1"/>

  <!-- Badge / Verified Stamp Floating -->
  <g transform="translate(110, 85)" filter="drop-shadow(0 8px 16px rgba(52,120,212,0.22))">
    <circle cx="26" cy="26" r="24" fill="#3478D4"/>
    <circle cx="26" cy="26" r="20" fill="#2563EB"/>
    <path d="M18 26l5 5 10-10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
