<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <!-- Brand Icon -->
  <g id="logo-mark" transform="translate(4, 4)">
    <!-- Monitor Base & Stand -->
    <path d="M22 52h12v-6H22v6z" fill="#3478D4"/>
    <path d="M14 52h28c1.1 0 2 .9 2 2s-.9 2-2 2H14c-1.1 0-2-.9-2-2s.9-2 2-2z" fill="#173B67"/>
    
    <!-- Monitor Outer Body -->
    <rect x="2" y="2" width="52" height="40" rx="6" fill="#173B67"/>
    <!-- Screen Inner Display -->
    <rect x="5" y="5" width="46" height="34" rx="4" fill="#F5F8FC"/>
    
    <!-- Digital Document Graphic inside Screen -->
    <g transform="translate(14, 9)">
      <!-- Document Base with folded corner -->
      <path d="M2 2h16l8 8v16a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#3478D4"/>
      <!-- Folded corner tab -->
      <path d="M18 2v8h8" fill="#60A5FA"/>
      <!-- Digital data lines -->
      <line x1="5" y1="10" x2="13" y2="10" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="5" y1="15" x2="21" y2="15" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="5" y1="20" x2="17" y2="20" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Digital spark / connectivity dot -->
      <circle cx="21" cy="22" r="2" fill="#38BDF8"/>
    </g>
    
    <!-- Monitor status dot -->
    <circle cx="28" cy="42" r="1.2" fill="#38BDF8"/>
  </g>

  <!-- Typography -->
  <g id="logo-text" transform="translate(72, 16)">
    <text x="0" y="20" font-family="'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#173B67" letter-spacing="-0.5">
      DIGITAL<tspan fill="#3478D4">CYBER</tspan>
    </text>
    <text x="0" y="34" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2.8">
      CAFE &bull; ONLINE SERVICES
    </text>
  </g>
</svg>
