<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <!-- Brand Icon Badge -->
  <g id="logo-badge" transform="translate(4, 4)">
    <!-- Base Drop Shadow / Glow -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#F0F6FC" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Monitor Base & Stand -->
    <path d="M23 44h10v-5H23v5z" fill="#3478D4"/>
    <rect x="15" y="44" width="26" height="3" rx="1.5" fill="#173B67"/>
    
    <!-- Monitor Outer Frame -->
    <rect x="6" y="8" width="44" height="30" rx="5" fill="#173B67"/>
    <!-- Screen Inner Display -->
    <rect x="9" y="11" width="38" height="24" rx="3" fill="#FFFFFF"/>
    
    <!-- Digital Document Graphic inside Screen -->
    <g transform="translate(18, 14)">
      <!-- Document Body with folded corner -->
      <path d="M0 0h12l6 6v14a2 2 0 0 1-2 2H0a1 1 0 0 1-1-1V1a1 1 0 0 1 1-1z" fill="#3478D4"/>
      <!-- Fold corner tab -->
      <path d="M12 0v6h6" fill="#60A5FA"/>
      <!-- Digital data lines -->
      <line x1="3" y1="7" x2="9" y2="7" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="3" y1="11" x2="15" y2="11" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="3" y1="15" x2="12" y2="15" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Tech Checkmark Badge -->
      <circle cx="15" cy="17" r="4" fill="#10B981"/>
      <path d="M13.5 17l1 1 2-2" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Logo Typography -->
  <g id="logo-text" transform="translate(68, 14)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="22" font-family="'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#173B67" letter-spacing="-0.5">
      DIGITAL <tspan fill="#3478D4">CYBER</tspan>
    </text>
    <!-- Sub-Brand Tagline -->
    <text x="1" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="2.6">
      CAFE &bull; ONLINE SERVICES
    </text>
  </g>
</svg>
